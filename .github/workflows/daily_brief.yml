name: Daily Financial Brief

on:
  # Primary trigger: Cloudflare Worker cron (see cron-worker/) pings
  # repository_dispatch at SGT 09:30 with sub-minute accuracy.
  repository_dispatch:
    types: [daily-brief]
  # Fallback: native Actions cron — unreliable (often delayed by hours)
  # but acts as a safety net if the Worker is down.
  schedule:
    - cron: "30 1 * * *"  # UTC 01:30 = SGT 09:30
  workflow_dispatch: # manual test trigger

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv yfinance beautifulsoup4

      - name: Run daily brief
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
        working-directory: app
        run: python daily_job.py
